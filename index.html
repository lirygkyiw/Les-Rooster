<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beginscherm</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: url('rain.gif') no-repeat center center fixed; /* jouw GIF */
      background-size: cover; /* zorgt dat de GIF altijd het scherm vult */
    }

    .container {
      background: rgba(255, 255, 255, 0.43); 
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 300px;
      text-align: center;
      margin: auto;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
    }

    h1 {
      margin-bottom: 10px;
      color: #1b1b1b;
    }

    a {
      display: block;
      text-decoration: none;
      background: #4c98af;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }
    a:hover {
      background: #4583a0;
      transform: translateY(-3px);
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welkom</h1>

    <a href="ZW.html">Z&W</a>

  </div>

</body>
</html>
